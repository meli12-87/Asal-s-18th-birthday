<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Asal</title>
<link rel="stylesheet" href="css/style.css">
<style>
  body{ overflow:hidden; }
  .intro-wrap{
    height:100vh; width:100vw;
    display:flex; align-items:center; justify-content:center;
    position:relative; text-align:center; padding: 0 6vw;
  }
  .candle{
    position:absolute; bottom:8%; left:50%; transform:translateX(-50%);
    width:2px; height:60px;
    background:linear-gradient(180deg, transparent, var(--gold));
    opacity:.5;
  }
  .intro-lines{ max-width: 720px; }
  .intro-lines p{
    font-family:'Cormorant Garamond', serif;
    font-weight:400;
    font-size: clamp(1.3rem, 3.4vw, 2.1rem);
    line-height:1.6;
    opacity:0;
    transform: translateY(16px);
    filter: blur(4px);
    color: var(--cream);
  }
  .intro-lines p.for-name{
    font-size: clamp(1rem, 2vw, 1.2rem);
    letter-spacing:.3em; text-transform:uppercase;
    color: var(--gold);
    margin-bottom: 10px;
  }
  .intro-lines p.emph{
    font-size: clamp(1.6rem, 4.4vw, 2.8rem);
    margin: 22px 0 6px;
  }
  .intro-lines .spacer{ height: 6px; }
  .enter-btn-wrap{
    margin-top: 46px; opacity:0; transform: translateY(10px);
  }
  @keyframes lineIn{
    to{ opacity:1; transform:translateY(0); filter:blur(0); }
  }
  .glow-bg{
    position:absolute; inset:0; z-index:-1;
    background:
      radial-gradient(circle at 50% 55%, rgba(207,167,95,.08), transparent 55%);
    animation: pulse 6s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{ opacity:.6; } 50%{ opacity:1; }
  }
  .site-nav{ opacity:0; transform: translateY(-8px); transition: opacity 1s ease, transform 1s ease; pointer-events:none; }
  .site-nav.shown{ opacity:1; transform:none; pointer-events:auto; }
</style>
</head>
<body>

<nav class="site-nav" id="introNav">
  <div class="brand">asal<span>.</span>18</div>
  <button class="nav-toggle">☰</button>
  <div class="nav-links">
    <a href="home.html">Home</a>
    <a href="playlist.html">Playlist</a>
    <a href="moodboard.html">Mood Board</a>
    <a href="letter.html">Letter</a>
    <a href="distance.html">Distance</a>
    <a href="timeline.html">Timeline</a>
  </div>
</nav>

<div class="intro-wrap">
  <div class="glow-bg"></div>
  <div class="candle"></div>
  <div class="intro-lines" id="introLines">
    <p class="for-name" style="animation: lineIn 1.4s var(--ease) forwards; animation-delay: .3s;">For Asal</p>
    <p class="emph" style="animation: lineIn 1.4s var(--ease) forwards; animation-delay: 1.4s;">6 years.</p>
    <p style="animation: lineIn 1.4s var(--ease) forwards; animation-delay: 2.5s;">Thousands of memories.</p>
    <p style="animation: lineIn 1.4s var(--ease) forwards; animation-delay: 3.4s;">One unforgettable person.</p>
    <p class="emph" style="animation: lineIn 1.4s var(--ease) forwards; animation-delay: 4.6s; color:var(--gold);">Happy 18th Birthday 🤍</p>
  </div>
  <div class="enter-btn-wrap" id="enterBtnWrap">
    <a href="home.html" class="btn solid">Come In</a>
  </div>
</div>

<script>
  setTimeout(() => {
    document.getElementById('enterBtnWrap').style.transition = 'opacity 1.2s ease, transform 1.2s ease';
    document.getElementById('enterBtnWrap').style.opacity = '1';
    document.getElementById('enterBtnWrap').style.transform = 'translateY(0)';
    document.getElementById('introNav').classList.add('shown');
  }, 5900);

  const toggle = document.querySelector('.nav-toggle');
  const links = document.querySelector('.nav-links');
  toggle.addEventListener('click', () => links.classList.toggle('open'));
</script>
</body>
</html>
